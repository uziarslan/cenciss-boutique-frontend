  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div
        id="app-boot-loader"
        role="status"
        aria-label="Loading Cenciss"
        style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#020617;color:#cbd5e1;font:600 14px system-ui,sans-serif;letter-spacing:.02em"
      >
        Loading Cenciss…
      </div>
    </div>
    <script>
      // Entry-module failures happen before React can render an error boundary.
      // If a stale service worker/cache ever leaves the root empty, perform one
      // automatic clean recovery—the equivalent of the user's hard refresh.
      (() => {
        const recoveryKey = 'cenciss:boot-recovery';
        const recoveryCooldownMs = 60000;

        window.setTimeout(async () => {
          const root = document.getElementById('root');
          if (window.__CENCISS_APP_BOOTED__ && root?.childElementCount) return;

          const now = Date.now();
          try {
            const previous = Number(sessionStorage.getItem(recoveryKey)) || 0;
            if (now - previous < recoveryCooldownMs) return;
            sessionStorage.setItem(recoveryKey, String(now));
          } catch {
            // Storage can be unavailable in private/embedded browser modes.
          }

          try {
            if ('serviceWorker' in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map((registration) => registration.unregister()));
            }
            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(keys
                .filter((key) => key.startsWith('cenciss-pos-'))
                .map((key) => caches.delete(key)));
            }
          } finally {
            const url = new URL(window.location.href);
            url.searchParams.set('__app_recovery', String(now));
            window.location.replace(url.href);
          }
        }, 4000);
      })();
    </script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
